services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: text-embedder
    ports:
      - "1010:80"
    volumes:
      - ./embedder_cache/models--sentence-transformers--paraphrase-multilingual-MiniLM-L12-v2:/data/model
    environment:
      - HF_HUB_OFFLINE=1
    command: --model-id /data/model

  ollama:
    restart: unless-stopped
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama-pull:
    restart: no
    image: ollama/ollama:latest
    container_name: llama3-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama"]
    command: ["pull", "llama3.2:3b"]
    environment:
      OLLAMA_HOST: "ollama:11434"

  mlflow-server:
    restart: unless-stopped
    image: ghcr.io/mlflow/mlflow:v3.15.2
    container_name: mlflow-server
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/mlartifacts

volumes:
  qdrant_storage:
  embedder_cache:
  ollama_data:
  mlflow_data: