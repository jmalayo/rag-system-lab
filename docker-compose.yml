services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    ports:
      - "1010:80"
    volumes:
      - ./embedder_cache/models--sentence-transformers--paraphrase-multilingual-MiniLM-L12-v2:/data/model
    environment:
      - HF_HUB_OFFLINE=1
    command: --model-id /data/model

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  
volumes:
  qdrant_storage:
  embedder_cache:
  ollama_data: